name: Normalize Goal title

# Every issue in this repository is a Goal, so Goals get no issue type and no
# kind label. This only removes a leading "[Goal]" from the title.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Strip the [Goal] title prefix
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const nextTitle = issue.title.replace(/^\[Goal\]\s+/, "");
            if (nextTitle === issue.title || nextTitle.length === 0) {
              core.info(`Issue #${issue.number} already matches`);
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: nextTitle,
            });
            core.info(`Retitled #${issue.number}`);

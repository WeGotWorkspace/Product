name: Normalize issue type and title

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Set Feature type on Goals and strip the [Goal] prefix
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((label) => label.name);
            const wanted = labels.includes("type:goal") ? "Feature" : null;
            const current = issue.type?.name ?? null;
            const nextTitle = issue.title.replace(/^\[Goal\]\s+/, "");
            const titleNeedsUpdate = nextTitle !== issue.title && nextTitle.length > 0;
            const typeNeedsUpdate = Boolean(wanted) && current !== wanted;

            if (!titleNeedsUpdate && !typeNeedsUpdate) {
              core.info(`Issue #${issue.number} already matches`);
              return;
            }

            // One REST update sets both. The workflow token can set the type here
            // with issues: write. It cannot read the org's issue types through
            // GraphQL, which is why the old lookup failed.
            const { data: updated } = await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              ...(titleNeedsUpdate ? { title: nextTitle } : {}),
              ...(typeNeedsUpdate ? { type: wanted } : {}),
            });
            if (titleNeedsUpdate) core.info(`Retitled #${issue.number}`);
            if (!typeNeedsUpdate) return;

            // GitHub drops a type change silently when the caller may not set it.
            if (updated.type?.name !== wanted) {
              core.setFailed(
                `Issue #${issue.number} still has type ${updated.type?.name ?? "none"}, wanted ${wanted}`,
              );
              return;
            }
            core.info(`Set #${issue.number} issue type to ${wanted}`);

name: Restrict external issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  enforce-maintainer-only-goals:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues from non-maintainers
        uses: actions/github-script@v9
        with:
          script: |
            // Every issue in this repository is a Goal, and only maintainers file Goals.
            // A maintainer is anyone with write access or more. Check the author's repository
            // permission: author_association is CONTRIBUTOR for org members whose membership is
            // private, so it would close Goals filed by maintainers.
            const issue = context.payload.issue;
            const login = issue.user.login;
            const association = issue.author_association;
            const maintainerPermissions = new Set(['admin', 'maintain', 'write']);

            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: login,
              });
              permission = data.permission;
            } catch (error) {
              // Do not close anything when the check itself fails; a maintainer can close spam by hand.
              core.warning(`Could not read the permission of ${login}: ${error.message}. Leaving #${issue.number} open.`);
              return;
            }

            if (maintainerPermissions.has(permission)) {
              core.info(`Allowing ${login} (permission: ${permission}, association: ${association})`);
              return;
            }

            const body = [
              'Thanks for your interest in WeGotWorkspace.',
              '',
              '**Goals are maintainer-filed only.**',
              '',
              'Please use:',
              '- [Discussions](https://github.com/WeGotWorkspace/WeGotWorkspace/discussions) for ideas and exploration (maintainers may promote promising threads to Goals)',
              '- The [Bug report](https://github.com/WeGotWorkspace/WeGotWorkspace/issues/new?template=bug-report.yml) template in the code repository for defects',
              '',
              `_Closed automatically (repository permission: \`${permission}\`)._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            core.info(`Closed issue #${issue.number} from ${login} (permission: ${permission})`);
